stages:
  - prepare
  - build
  - test
  - deploy

image: node:22-alpine

variables:
  PNPM_STORE_DIR: .pnpm-store

default:
  before_script:
    - npm install --global pnpm@11.18.0

# pnpm store is content-addressable: caching it (rather than node_modules,
# whose symlinks do not survive artifact transfer) makes installs fast.
cache: &cache
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

install:
  stage: prepare
  script:
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
  cache:
    <<: *cache
    policy: pull-push

lint:
  stage: build
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
    - pnpm lint
  cache:
    <<: *cache
    policy: pull

build:
  stage: build
  needs: [install]
  script:
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
    - pnpm build
  cache:
    <<: *cache
    policy: pull-push

test:
  stage: test
  needs: [lint, build]
  script:
    - pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
    - pnpm test
  cache:
    <<: *cache
    policy: pull

deploy:
  stage: deploy
  image: curlimages/curl
  needs: [test]
  # No Node/pnpm in this image; skip the default before_script.
  before_script: []
  variables:
    GIT_STRATEGY: none
  script:
    - >
      curl -X POST
      -H "Content-Type: application/json"
      -H "X-Gitlab-Event: Push Hook"
      -d '{"object_kind":"push","ref":"refs/heads/main","repository":{"full_name":"'"${CI_PROJECT_PATH}"'"}}'
      "${DEPLOY_WEBHOOK_URL}"
  only:
    - main
