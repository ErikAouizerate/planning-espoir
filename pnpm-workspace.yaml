packages:
  - shared
  - api
  - webapp

# Dependency version overrides (formerly `resolutions` in the yarn manifest).
overrides:
  '@nestjs/platform-express>multer': 2.4.0
  '@istanbuljs/load-nyc-config>js-yaml': 3.15.2
  qs: 6.16.0
  fast-uri: 3.1.6
  nanoid: 3.3.18
  uuid: 11.1.1
  sharp: 0.35.4
  js-yaml: 4.3.2

# ── Supply-chain hardening (Basic Memory policy « pnpm Policy for JS-TS Projects ») ──
# Release cooldown: block installing a package version published less than
# 7 days ago (10080 minutes).
minimumReleaseAge: 10080
# Fail instead of falling back to a too-recent version when none satisfies the window.
minimumReleaseAgeStrict: true
# Escape hatch for versions genuinely needed despite the cooldown. Remove an
# entry once its version is older than the window.
minimumReleaseAgeExclude:
  - '@rolldown/binding-linux-x64-gnu@1.2.8'
  - '@rolldown/binding-openharmony-arm64@1.2.8'
  - multer@2.4.0
# Block transitive sub-dependencies from fetching code from an external git repo.
blockExoticSubdeps: true
# Refuse to run preinstall/install/postinstall lifecycle scripts unless allow-listed.
strictDepBuilds: true

# Packages legitimately needing a build script.
allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
