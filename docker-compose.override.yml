# docker-compose.override.yml — local development only.
# Compose auto-merges this on top of docker-compose.yml when running
# `docker compose up` with no -f flags. Never applied in production.
#
# Hot-reload containers behind the shared Caddy proxy
# (localhost-reverse-proxy, external network `local-proxy`):
#   webapp -> http://planning-espoir.localhost
#   api    -> http://api.planning-espoir.localhost
# The webapp calls the API cross-origin; CORS_ORIGINS on the API allows it.
# The project sources are bind-mounted; node_modules come from the image and
# are masked by named volumes so the host tree never shadows them.
services:
  api:
    build:
      target: dev
    environment:
      - DATA_DIR=/app/api/data
      - CORS_ORIGINS=http://planning-espoir.localhost
    command: sh -c "pnpm --filter @planning-espoir/shared run build && pnpm --filter @planning-espoir/api run start:dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules
      - webapp_node_modules:/app/webapp/node_modules
      - shared_node_modules:/app/shared/node_modules
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - planning-net
      - proxy
    labels:
      # Scheme-qualified on purpose: a bare hostname makes Caddy listen on
      # :443, which the proxy does not publish (auto_https is off).
      caddy: http://api.planning-espoir.localhost
      caddy.reverse_proxy: '{{upstreams 3000}}'

  webapp:
    build:
      target: dev
    env_file: .env
    environment:
      - VITE_API_BASE=http://api.planning-espoir.localhost/api
    command: sh -c "pnpm --filter @planning-espoir/shared run build && pnpm --filter @planning-espoir/webapp run dev"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules
      - webapp_node_modules:/app/webapp/node_modules
      - shared_node_modules:/app/shared/node_modules
    ports:
      - '127.0.0.1:5174:5174'
    depends_on:
      - api
    networks:
      - planning-net
      - proxy
    labels:
      caddy: http://planning-espoir.localhost
      caddy.reverse_proxy: '{{upstreams 5174}}'

volumes:
  node_modules:
  api_node_modules:
  webapp_node_modules:
  shared_node_modules:

networks:
  proxy:
    external: true
    name: local-proxy
