# docker-compose.yml — production stack, deployed as-is by Dokploy.
# No host ports are published here: Dokploy's reverse proxy (Traefik) routes to
# the exposed container ports. Local development uses docker-compose.override.yml.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - api-data:/data
    expose:
      - '3000'
    networks:
      - planning-net
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
        VITE_APP_GROUP: ${VITE_APP_GROUP}
    expose:
      - '8080'
    depends_on:
      - api
    networks:
      - planning-net
    restart: unless-stopped

volumes:
  api-data:

networks:
  planning-net:
    driver: bridge
